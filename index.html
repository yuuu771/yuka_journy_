<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuka Journey</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3ed;
      color: #222;
    }

    header {
      padding: 30px 8%;
      background: #fffaf4;
    }

    nav {
      margin-top: 15px;
    }

    nav a {
      margin-right: 20px;
      text-decoration: none;
      color: #444;
    }

    .hero {
      padding: 80px 8%;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero p {
      max-width: 600px;
      line-height: 1.8;
    }

    .section {
      padding: 40px 8%;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    footer {
      padding: 30px 8%;
      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h2>Yuka Journey</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#">School</a>
      <a href="#">Life in NYC</a>
      <a href="#">Cafe</a>
      <a href="#">About</a>
    </nav>
  </header>

  <section class="hero">
    <h1>My life in New York.</h1>

    <p>
      ニューヨークでの学生生活、日々のこと、
      カフェやお気に入りの場所を記録しています。
    </p>
  </section>

  <section class="section">
    <h2>Latest Posts</h2>

    <div class="cards">
      <div class="card">
        <h3>School</h3>
        <p>大学院の授業や課題について。</p>
      </div>

      <div class="card">
        <h3>Life in NYC</h3>
        <p>ニューヨークでの日常やお出かけ。</p>
      </div>

      <div class="card">
        <h3>Cafe</h3>
        <p>カフェのメニュー、店内、雰囲気を詳しく。</p>
      </div>
    </div>
  </section>

  <footer>
    © Yuka Journey
  </footer>

</body>
</html>
